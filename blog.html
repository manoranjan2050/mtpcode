<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — MTPCode</title>
  <meta name="description" content="Notes on building and shipping real software — Android, Laravel, IoT and everything in between, written by Manoranjan Das." />
  <link rel="canonical" href="https://mtpcode.com/blog.html" />
  <meta name="theme-color" content="#0F172A" />
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
</head>
<body class="overflow-x-hidden bg-white dark:bg-dark-950">
  <div id="page-loader"><div class="loader-ring"></div></div>
  <div data-include="/components/header.html"></div>

  <main>
    <section class="relative overflow-hidden bg-gradient-hero pb-16 pt-40 sm:pt-48">
      <div class="pointer-events-none absolute inset-0 -z-10">
        <div class="bg-blob left-[-10%] top-0 h-96 w-96 bg-primary-600"></div>
        <div class="bg-blob right-[-5%] top-20 h-96 w-96 bg-secondary-600"></div>
      </div>
      <div class="container-page text-center">
        <span class="eyebrow bg-white/10 text-white ring-1 ring-inset ring-white/20">Blog</span>
        <h1 class="mt-4 text-balance font-display text-4xl font-extrabold text-white sm:text-5xl">Notes on Building Real Software</h1>
        <p class="mx-auto mt-4 max-w-2xl text-lg text-slate-300">Architecture decisions, lessons from production and the occasional war story.</p>
      </div>
    </section>

    <section class="section !pt-14">
      <div class="container-page">
        <div class="mx-auto max-w-md">
          <label for="blog-search-input" class="sr-only">Search articles</label>
          <div class="relative">
            <i data-lucide="search" class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-dark-700/40 dark:text-slate-500"></i>
            <input id="blog-search-input" type="search" placeholder="Search articles..." class="input !pl-11" />
          </div>
        </div>
        <div id="blog-filter-root" class="mt-8 flex flex-wrap justify-center gap-3"></div>
        <div id="blog-grid-root" class="mt-12 grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3"></div>
      </div>
    </section>
  </main>

  <div data-include="/components/footer.html"></div>
  <script type="module" src="/assets/js/blog-listing.js"></script>
</body>
</html>
