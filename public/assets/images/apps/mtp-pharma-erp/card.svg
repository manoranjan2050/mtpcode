<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="MTP Pharma ERP card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="45%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#4E1DA6"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#312E81" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1380" cy="130" r="260" fill="#93C5FD" opacity="0.35"/>
  <circle cx="170" cy="870" r="220" fill="#5B21B6" opacity="0.18"/>
  <circle cx="1180" cy="820" r="160" fill="#FFFFFF" opacity="0.22"/>
  <g filter="url(#soft)">
    <rect x="180" y="250" width="420" height="420" rx="96" fill="#FFFFFF"/>
    <rect x="250" y="320" width="280" height="280" rx="64" fill="url(#icon)"/>
    <rect x="320" y="390" width="140" height="160" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="345" y="420" width="90" height="14" rx="4" fill="#2563EB" opacity="0.55"/>
    <rect x="345" y="450" width="90" height="14" rx="4" fill="#7C3AED" opacity="0.45"/>
    <rect x="345" y="480" width="60" height="14" rx="4" fill="#2563EB" opacity="0.35"/>
    <circle cx="390" cy="530" r="18" fill="#06B6D4"/>
  </g>
  <text x="700" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" fill="#1E1B4B">MTP Pharma ERP</text>
  <text x="700" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" fill="#3730A3">Billing, inventory &amp; batch expiry</text>
  <text x="700" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#312E81" opacity="0.75">GST-ready pharmacy management</text>
  <rect x="700" y="650" width="160" height="52" rx="26" fill="#FFFFFF" opacity="0.85"/>
  <text x="780" y="685" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#4E1DA6" text-anchor="middle">ERP</text>
