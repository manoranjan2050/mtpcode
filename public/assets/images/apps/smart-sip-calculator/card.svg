<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Smart SIP Calculator card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="45%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#5B21B6" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1380" cy="130" r="260" fill="#A5F3FC" opacity="0.4"/>
  <circle cx="170" cy="870" r="220" fill="#7C3AED" opacity="0.16"/>
  <circle cx="1180" cy="820" r="160" fill="#FFFFFF" opacity="0.22"/>
  <g filter="url(#soft)">
    <rect x="180" y="250" width="420" height="420" rx="96" fill="#FFFFFF"/>
    <rect x="250" y="320" width="280" height="280" rx="64" fill="url(#icon)"/>
    <path d="M310 520 L370 450 L430 490 L500 400" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="500" cy="400" r="14" fill="#FFFFFF"/>
  </g>
  <text x="700" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#312E81">Smart SIP Calculator</text>
  <text x="700" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" fill="#5B21B6">9 finance calculators in one app</text>
  <text x="700" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#4338CA" opacity="0.75">SIP  ·  EMI  ·  Retirement  ·  FD  ·  PPF</text>
  <rect x="700" y="640" width="220" height="52" rx="26" fill="#FFFFFF" opacity="0.85"/>
  <text x="810" y="675" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#7C3AED" text-anchor="middle">Android</text>
