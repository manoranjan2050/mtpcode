<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="ThermalDesk card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="45%" stop-color="#CFFAFE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1E3A8A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1380" cy="130" r="260" fill="#67E8F9" opacity="0.35"/>
  <circle cx="170" cy="870" r="220" fill="#1D4ED8" opacity="0.18"/>
  <circle cx="1180" cy="820" r="160" fill="#FFFFFF" opacity="0.22"/>
  <g filter="url(#soft)">
    <rect x="180" y="250" width="420" height="420" rx="96" fill="#FFFFFF"/>
    <rect x="250" y="320" width="280" height="280" rx="64" fill="url(#icon)"/>
    <rect x="310" y="390" width="160" height="28" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <rect x="310" y="450" width="110" height="18" rx="6" fill="#FFFFFF" opacity="0.7"/>
    <rect x="310" y="490" width="160" height="18" rx="6" fill="#FFFFFF" opacity="0.55"/>
    <rect x="310" y="530" width="90" height="18" rx="6" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <text x="700" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" fill="#0F172A">ThermalDesk</text>
  <text x="700" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" fill="#1E40AF">ESC/POS printing without the pain</text>
  <text x="700" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1E3A8A" opacity="0.75">Bluetooth  ·  USB  ·  Network receipts</text>
  <rect x="700" y="660" width="220" height="52" rx="26" fill="#FFFFFF" opacity="0.85"/>
  <text x="810" y="695" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="middle">Android</text>
